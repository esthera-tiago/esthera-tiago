<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Animated cat walking banner">
  <defs>
    <linearGradient id="catBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="catBell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D0FE"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
  </defs>

  <g opacity="0.9">
    <path d="M60 148H840" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 16">
      <animate attributeName="stroke-dashoffset" values="0;-320" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="560 20; 620 18; 690 22; 760 18; 825 20; 560 20" dur="6s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0; 0 2; 0 0" dur="0.85s" repeatCount="indefinite"/>

      <path d="M20 114C-8 104 -20 86 -12 64" stroke="#C4B5FD" stroke-width="8" stroke-linecap="round" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="-12 12 106; 12 12 106; -12 12 106" dur="1.1s" repeatCount="indefinite"/>
      </path>

      <ellipse cx="92" cy="112" rx="68" ry="34" fill="url(#catBody)"/>
      <ellipse cx="30" cy="110" rx="48" ry="25" fill="#E9D5FF" opacity="0.85"/>
      <circle cx="152" cy="82" r="38" fill="#EDE9FE"/>
      <circle cx="151" cy="84" r="5" fill="#1A1025"/>
      <circle cx="165" cy="83" r="5" fill="#1A1025"/>
      <path d="M150 70L138 46L160 62L150 70Z" fill="#C4B5FD"/>
      <path d="M150 70L163 46L138 62L150 70Z" fill="#C4B5FD"/>
      <path d="M154 75L168 88L160 98L154 75Z" fill="#F5D0FE"/>
      <circle cx="98" cy="112" r="7" fill="#F5D0FE"/>

      <g>
        <rect x="69" y="144" width="14" height="36" rx="6" fill="#A78BFA">
          <animateTransform attributeName="transform" type="rotate" values="-18 76 144; 18 76 144; -18 76 144; -30 76 144; -18 76 144" dur="0.8s" repeatCount="indefinite"/>
        </rect>
        <rect x="92" y="146" width="14" height="34" rx="6" fill="#8B5CF6">
          <animateTransform attributeName="transform" type="rotate" values="18 99 146; -18 99 146; 18 99 146; 28 99 146; 18 99 146" dur="0.8s" repeatCount="indefinite"/>
        </rect>
      </g>

      <g>
        <path d="M116 110C126 96 140 94 150 94" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
        <path d="M175 95C184 94 198 97 202 106" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
      </g>

      <g>
        <circle cx="184" cy="96" r="9" fill="url(#catBell)"/>
        <circle cx="184" cy="96" r="3" fill="#7C3AED"/>
      </g>
    </g>
