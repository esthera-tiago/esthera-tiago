<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Outline of a cat walking left along a moving line</title>
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="1"/>
    </linearGradient>
    <!-- Keeps only the purple outline of the cat shape -->
    <filter id="outline" filterUnits="userSpaceOnUse" x="-60" y="-60" width="880" height="700">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="grown"/>
      <feComposite in="grown" in2="SourceAlpha" operator="out" result="edge"/>
      <feFlood flood-color="#8b5cf6" result="color"/>
      <feComposite in="color" in2="edge" operator="in"/>
    </filter>
  </defs>

  <!-- Ground lines roll to the right while the cat walks left in place -->
  <line x1="0" y1="172" x2="900" y2="172" stroke="url(#fade)" stroke-width="3" stroke-linecap="round" stroke-dasharray="16 12">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="186" x2="900" y2="186" stroke="url(#fade)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 18" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.8s" repeatCount="indefinite"/>
  </line>

